plugins {
    id 'java'
    // Fat JAR: Burp carga un unico JAR, hay que empaquetar Gson dentro.
    id 'com.gradleup.shadow' version '8.3.5'
}
repositories { mavenCentral() }
dependencies {
    // Fija la version a la que coincida con tu Burp (Extensions -> APIs).
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.8'
    implementation 'com.google.code.gson:gson:2.11.0'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
// Compila con:  ./gradlew shadowJar   -> build/libs/*-all.jar
